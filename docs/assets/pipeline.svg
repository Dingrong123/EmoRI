<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="350" viewBox="0 0 1180 350" role="img" aria-labelledby="title desc">
<title id="title">EmoRI Python processing pipeline</title>
<desc id="desc">Raw radar IQ is decoded into points. Stationary radar returns provide velocity. Aligned IMU supplies heading and an offline fallback for gaps. A fixed mounting rotation and yaw combine these into a trajectory and static-point map. Ground truth is used for evaluation.</desc>
